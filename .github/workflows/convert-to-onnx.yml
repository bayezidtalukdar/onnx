name: Convert YOLO11m to ONNX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install ultralytics onnx onnxruntime onnxslim

      - name: Download model
        run: |
          wget https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo11m-pose.pt

      - name: Convert to ONNX
        run: |
          python -c "from ultralytics import YOLO; YOLO('yolo11m.pt').export(format='onnx')"

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add yolo11m.onnx
          git commit -m "Add YOLO11m ONNX model" || echo "No changes"
          git push
